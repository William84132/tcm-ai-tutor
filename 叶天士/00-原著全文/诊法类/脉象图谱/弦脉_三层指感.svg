<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400">
<style>
@keyframes moveFinger {
  0%   { transform: translateY(14px); }
  15%  { transform: translateY(14px); }
  35%  { transform: translateY(94px); }
  50%  { transform: translateY(94px); }
  70%  { transform: translateY(174px); }
  85%  { transform: translateY(174px); }
  92%  { transform: translateY(14px); }
  100% { transform: translateY(14px); }
}
@keyframes vib1 { 0%,10%{transform:translateY(0)} 5%{transform:translateY(-12px)} 15%,100%{transform:translateY(0)} }
@keyframes vib2 { 0%,30%{transform:translateY(0)} 35%{transform:translateY(-12px)} 45%,100%{transform:translateY(0)} }
@keyframes vib3 { 0%,65%{transform:translateY(0)} 70%{transform:translateY(-12px)} 80%,100%{transform:translateY(0)} }
@keyframes lbl1 { 0%,15%{opacity:1} 17%,100%{opacity:.25} }
@keyframes lbl2 { 0%,33%{opacity:.25} 35%,50%{opacity:1} 52%,100%{opacity:.25} }
@keyframes lbl3 { 0%,68%{opacity:.25} 70%,85%{opacity:1} 87%,100%{opacity:.25} }
.finger { animation: moveFinger 9s ease-in-out infinite; }
.s1 { animation: vib1 9s linear infinite; }
.s2 { animation: vib2 9s linear infinite; }
.s3 { animation: vib3 9s linear infinite; }
.l1 { animation: lbl1 9s linear infinite; }
.l2 { animation: lbl2 9s linear infinite; }
.l3 { animation: lbl3 9s linear infinite; }
</style>
<rect width="680" height="400" fill="#faf9f6"/>
<text x="24" y="34" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" fill="#1a1a1a">弦脉 · 三层指感动画（浮取 · 中取 · 沉取）</text>
<text x="24" y="58" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#666666">端直以长，如按琴弦 —— 三层都是琴弦在顶手，指感一致，只是按的深度不同</text>

<!-- 手指（指腹朝下，随动画逐层下按） -->
<g class="finger">
  <rect x="150" y="18" width="92" height="62" rx="16" fill="#f2c4a0" stroke="#b98a6a" stroke-width="2"/>
  <ellipse cx="196" cy="84" rx="46" ry="20" fill="#f8d5b8" stroke="#b98a6a" stroke-width="2"/>
  <path d="M165,70 Q196,52 227,70" fill="none" stroke="#d9a88a" stroke-width="2"/>
</g>

<!-- 层位标尺 -->
<line x1="60" y1="118" x2="88" y2="118" stroke="#bbbbbb" stroke-width="2"/>
<line x1="60" y1="198" x2="88" y2="198" stroke="#bbbbbb" stroke-width="2"/>
<line x1="60" y1="278" x2="88" y2="278" stroke="#bbbbbb" stroke-width="2"/>
<text x="24" y="122" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#999999">浮</text>
<text x="24" y="202" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#999999">中</text>
<text x="24" y="282" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#999999">沉</text>

<!-- 三层琴弦 -->
<g class="s1"><line x1="120" y1="118" x2="520" y2="118" stroke="#8a6a4a" stroke-width="3.5" stroke-linecap="round"/></g>
<g class="s2"><line x1="120" y1="198" x2="520" y2="198" stroke="#8a6a4a" stroke-width="3.5" stroke-linecap="round"/></g>
<g class="s3"><line x1="120" y1="278" x2="520" y2="278" stroke="#8a6a4a" stroke-width="3.5" stroke-linecap="round"/></g>

<!-- 右侧说明：当前层指感 -->
<text class="l1" x="560" y="122" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#3c2eca">轻按即得</text>
<text class="l2" x="560" y="202" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#3c2eca">中取仍弦</text>
<text class="l3" x="560" y="282" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#3c2eca">沉按如故</text>

<text x="24" y="356" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" fill="#777777">口诀：端直以长，如按琴弦 —— 浮中沉三层皆弦（弦脉举按皆弦，不因深度改变指感）</text>
<text x="24" y="382" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#aaaaaa">动画循环：手指轻按（浮）→ 下压（中）→ 按至骨（沉）→ 回到浮层；三层琴弦均上顶</text>
</svg>